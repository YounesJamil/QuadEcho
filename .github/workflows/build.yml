# Baut QUAD ECHO fuer Windows und macOS, prueft es (DSP-Tests, pluginval) und stellt die Dateien bereit.
# Starten: auf GitHub unter "Actions" > "Build" > "Run workflow" (Downloads danach im Lauf unter "Artifacts").
# Bei einem Versions-Tag (z. B. git tag v0.2.0 && git push --tags) laeuft er von selbst und legt ein
# GitHub-Release mit den Zips an. Nicht bei jedem Push: Mac-Minuten zaehlen bei privaten Repos 10-fach.
name: Build

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            zip: QUAD-ECHO-Windows.zip
          - name: macOS
            os: macos-latest
            zip: QUAD-ECHO-macOS.zip

    steps:
      - uses: actions/checkout@v4

      - name: Konfigurieren
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            # Universal Binary: Apple Silicon und Intel
            cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          else
            cmake -S . -B build
          fi

      - name: Bauen
        shell: bash
        run: cmake --build build --config Release --parallel 4 --target QuadEcho_All QuadEchoTests

      - name: DSP-Tests
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            ./build/QuadEchoTests_artefacts/Release/QuadEchoTests.exe test-renders
          else
            ./build/QuadEchoTests_artefacts/Release/QuadEchoTests test-renders
          fi

      - name: Mac-Bundles signieren (ad hoc, ohne Apple-Konto)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          cd build/QuadEcho_artefacts/Release
          for b in "VST3/QUAD ECHO.vst3" "AU/QUAD ECHO.component" "Standalone/QUAD ECHO.app"; do
            codesign --force --deep --sign - "$b"
          done

      - name: pluginval (Strictness 10)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            curl -sSfL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip
            7z x pluginval.zip -opluginval > /dev/null
            ./pluginval/pluginval.exe --strictness-level 10 --validate-in-process --validate "build/QuadEcho_artefacts/Release/VST3/QUAD ECHO.vst3"
          else
            curl -sSfL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_macOS.zip
            unzip -q pluginval.zip -d pluginval
            ./pluginval/pluginval.app/Contents/MacOS/pluginval --strictness-level 10 --validate-in-process --validate "build/QuadEcho_artefacts/Release/VST3/QUAD ECHO.vst3"
          fi

      - name: AU pruefen (auval)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R "build/QuadEcho_artefacts/Release/AU/QUAD ECHO.component" ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          auval -v aufx Qecm Qdec

      - name: Paket packen
        shell: bash
        run: |
          mkdir -p package
          cp -R "build/QuadEcho_artefacts/Release/VST3/QUAD ECHO.vst3" package/
          if [ "$RUNNER_OS" = "macOS" ]; then
            cp -R "build/QuadEcho_artefacts/Release/AU/QUAD ECHO.component" package/
            cp -R "build/QuadEcho_artefacts/Release/Standalone/QUAD ECHO.app" package/
            cd package && ditto -c -k --sequesterRsrc --keepParent . "../${{ matrix.zip }}" && cd ..
          else
            cp "build/QuadEcho_artefacts/Release/Standalone/QUAD ECHO.exe" package/
          fi
          cp INSTALL.md package/
          cp Resources/Fonts/OFL.txt package/OFL-Barlow.txt
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a "${{ matrix.zip }}" ./package/* > /dev/null
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.zip }}
          path: ${{ matrix.zip }}

      - name: Release (nur bei Versions-Tag)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${{ github.ref_name }}" > /dev/null 2>&1 || gh release create "${{ github.ref_name }}" --title "QUAD ECHO ${{ github.ref_name }}" --notes "Siehe INSTALL.md im Zip." || true
          gh release upload "${{ github.ref_name }}" "${{ matrix.zip }}" --clobber
